[[opener.archive]]
block = true
desc = "Extract here"
run = '/etc/profiles/per-user/tower/bin/unar "$1" -o "$(dirname "$1")"'

[[opener.archive]]
block = true
desc = "Extract to subfolder"
run = '''
dir="$(basename "$1" | sed 's/\.[^.]*$//')"
mkdir -p "$dir" && /etc/profiles/per-user/tower/bin/unar "$1" -o "$dir"
'''

[[opener.audio]]
block = true
desc = "mpv (audio)"
run = 'mpv --no-video "$@"'

[[opener.audio]]
desc = "VLC"
orphan = true
run = 'vlc "$@"'

[[opener.browser]]
desc = "Firefox"
orphan = true
run = 'firefox "$@"'

[[opener.database]]
block = true
desc = "visidata"
run = 'vd "$@"'

[[opener.directory]]
desc = "Open dir in zedless"
orphan = true
run = 'zedless "$@"'

[[opener.edit]]
desc = "zedless"
orphan = true
run = 'zedless "$@"'

[[opener.edit]]
block = true
desc = "Neovim"
run = 'nvim "$@"'

[[opener.edit]]
block = true
desc = "micro"
run = 'micro "$@"'

[[opener.image]]
desc = "nomacs"
orphan = true
run = 'nomacs "$@"'

[[opener.image]]
desc = "GIMP"
orphan = true
run = 'gimp "$@"'

[[opener.json]]
desc = "zedless"
orphan = true
run = 'zedless "$@"'

[[opener.json]]
block = true
desc = "jq preview"
run = 'jq . "$@" | less'

[[opener.open]]
desc = "xdg-open"
orphan = true
run = 'xdg-open "$@"'

[[opener.pdf]]
desc = "Okular"
orphan = true
run = 'okular "$@"'

[[opener.pdf]]
desc = "xdg-open"
orphan = true
run = 'xdg-open "$@"'

[[opener.video]]
desc = "mpv"
orphan = true
run = 'mpv "$@"'

[[opener.video]]
desc = "VLC"
orphan = true
run = 'vlc "$@"'

[preview]
cache_dir = ""
image_delay = 0 
image_filter = "lanczos3"
image_quality = 85
max_height = 2048
max_width = 2048
tab_size = 4
wrap = "yes"

[tasks]
image_alloc = 4294967295
image_bound = [0, 0]
macro_workers = 30
micro_workers = 56

[which]
sort_reverse = false
sort_sensitive = false
